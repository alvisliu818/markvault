[package]
name = "markvault-kernel"
version.workspace = true
edition.workspace = true
description = "markvault kernel: Rust note-taking kernel serving HTTP API + web frontend"

[[bin]]
name = "markvault-kernel"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
comrak = { version = "0.34", default-features = false, features = ["shortcodes"] }
notify = "7"
notify-debouncer-full = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
futures = "0.3"
percent-encoding = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
dom_smoothie = "0.19"
htmd = "0.5"
base64 = "0.22"
ring = "0.17"
flate2 = "1"
