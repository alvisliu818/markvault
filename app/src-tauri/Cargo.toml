[package]
name = "markvault-app"
version = "0.1.0"
edition = "2021"
description = "markvault desktop shell (Tauri) — spawns the Rust kernel and renders its web UI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
winreg = "0.55"
